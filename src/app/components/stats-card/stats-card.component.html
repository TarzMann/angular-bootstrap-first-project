<!-- Bootstrap card displaying a single KPI metric -->
<div class="card h-100 shadow-sm border-0">
  <div class="card-body d-flex align-items-start gap-3">

    <!-- Icon badge -->
    <div class="rounded-3 p-2 bg-primary bg-opacity-10 text-primary">
      <i class="bi {{ card.icon }} fs-3"></i>
    </div>

    <!-- Metric text -->
    <div class="flex-grow-1">
      <p class="text-muted small mb-1">{{ card.label }}</p>
      <h4 class="fw-bold mb-0">{{ card.value }}</h4>
    </div>

    <!-- Trend indicator (top-right corner) -->
    <div>
      <!-- Trend up: green arrow -->
      <span *ngIf="card.trend === 'up'" class="badge text-bg-success">
        <i class="bi bi-arrow-up-short"></i> Up
      </span>
      <!-- Trend down: red arrow -->
      <span *ngIf="card.trend === 'down'" class="badge text-bg-danger">
        <i class="bi bi-arrow-down-short"></i> Down
      </span>
      <!-- Neutral: grey dash -->
      <span *ngIf="card.trend === 'neutral'" class="badge text-bg-secondary">
        <i class="bi bi-dash"></i> Stable
      </span>
    </div>

  </div>
</div>
