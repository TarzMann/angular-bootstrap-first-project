<!-- Bootstrap card displaying a single KPI metric -->
<div class="card h-100 border-0 rounded-4 overflow-hidden">
  <div class="card-body d-flex align-items-start gap-3">

    <!-- Icon badge -->
    <div class="rounded-3 p-2 icon-badge">
      <i class="bi {{ card.icon }} fs-3"></i>
    </div>

    <!-- Metric text -->
    <div class="flex-grow-1">
      <p class="text-muted small mb-0">{{ card.label }}</p>
      <h4 class="fw-semibold mb-0">{{ card.value }}</h4>
    </div>

    <!-- Trend indicator (top-right corner) -->
    <div>
      <!-- Trend up: green arrow -->
      <span *ngIf="card.trend === 'up'" class="badge badge-trend-up">
        <i class="bi bi-arrow-up-short"></i> Up
      </span>
      <!-- Trend down: red arrow -->
      <span *ngIf="card.trend === 'down'" class="badge badge-trend-down">
        <i class="bi bi-arrow-down-short"></i> Down
      </span>
      <!-- Neutral: grey dash -->
      <span *ngIf="card.trend === 'neutral'" class="badge badge-trend-neutral">
        <i class="bi bi-dash"></i> Stable
      </span>
    </div>

  </div>
</div>
